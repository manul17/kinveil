name: Build amneziawg-go Artifact

on:
  workflow_dispatch:
    inputs:
      awg_version:
        description: Upstream amneziawg-go tag
        required: true
        default: v3.1.20260828
        type: string
      awg_commit:
        description: Expected upstream commit SHA-1
        required: true
        default: b5928efb6ca19f0153958460c3d141f04abc5c2e
        type: string
      release_tag:
        description: Artifact release tag to publish
        required: true
        default: awg-v3.1.20260828
        type: string

permissions:
  contents: read

jobs:
  build-awg:
    name: Build static amneziawg-go (${{ inputs.awg_version }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Install pinned Go 1.27.4 toolchain
        run: |
          set -euo pipefail
          curl -fsSL -o go.tar.gz https://go.dev/dl/go1.27.4.linux-amd64.tar.gz
          echo "7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840  go.tar.gz" | sha256sum -c -
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf go.tar.gz
          rm -f go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          echo "GOTELEMETRY=off" >> "$GITHUB_ENV"

      - name: Clone and verify upstream amneziawg-go
        env:
          AWG_VERSION: ${{ inputs.awg_version }}
          AWG_COMMIT: ${{ inputs.awg_commit }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$AWG_VERSION" https://github.com/amnezia-vpn/amneziawg-go.git awg-src
          actual_commit="$(git -C awg-src rev-parse HEAD)"
          if [ "$actual_commit" != "$AWG_COMMIT" ]; then
            echo "Commit mismatch: expected $AWG_COMMIT, got $actual_commit" >&2
            exit 1
          fi

      - name: Build static Linux binaries
        env:
          AWG_VERSION: ${{ inputs.awg_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            out="../dist/amneziawg-go-${AWG_VERSION}-linux-${arch}"
            (
              cd awg-src
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
                go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o "$out" .
            )
            file "../dist/amneziawg-go-${AWG_VERSION}-linux-${arch}" || true
          done
          (cd dist && sha256sum "amneziawg-go-${AWG_VERSION}-linux-amd64" "amneziawg-go-${AWG_VERSION}-linux-arm64" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'dist/amneziawg-go-*'

      - name: Publish immutable artifact release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "amneziawg-go ${{ inputs.awg_version }} (precompiled artifacts)"
          generate_release_notes: true
          files: |
            dist/amneziawg-go-*
            dist/SHA256SUMS
